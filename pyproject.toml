[build-system]\nrequires = [\"setuptools>=45\", \"wheel\", \"setuptools_scm[toml]>=6.2\"]\nbuild-backend = \"setuptools.build_meta\"\n\n[project]\nname = \"whatsapp-nlp-analyzer\"\nversion = \"1.0.0\"\ndescription = \"NLP-based sentiment analysis and communication patterns from WhatsApp exports\"\nreadme = \"README.md\"\nrequires-python = \">=3.9\"\nlicense = {text = \"MIT\"}\nauthors = [\n    {name = \"Chaitanya Kondappa\", email = \"dev@example.com\"},\n]\nkeywords = [\"whatsapp\", \"nlp\", \"sentiment-analysis\", \"machine-learning\", \"visualization\"]\nclassifiers = [\n    \"Development Status :: 4 - Beta\",\n    \"Intended Audience :: End Users/Desktop\",\n    \"Topic :: Communications :: Chat\",\n    \"Topic :: Scientific/Engineering :: Artificial Intelligence\",\n    \"License :: OSI Approved :: MIT License\",\n    \"Programming Language :: Python :: 3\",\n    \"Programming Language :: Python :: 3.9\",\n    \"Programming Language :: Python :: 3.10\",\n    \"Programming Language :: Python :: 3.11\",\n    \"Programming Language :: Python :: 3.12\",\n]\n\ndependencies = [\n    \"Flask>=3.0.0\",\n    \"Werkzeug>=3.0.0\",\n    \"pandas>=2.0.0\",\n    \"numpy>=1.24.0\",\n    \"scikit-learn>=1.3.0\",\n    \"nltk>=3.8\",\n    \"textblob>=0.17.0\",\n    \"vaderSentiment>=3.3.0\",\n    \"wordcloud>=1.9.0\",\n    \"matplotlib>=3.7.0\",\n    \"seaborn>=0.12.0\",\n    \"Pillow>=9.0.0\",\n    \"plotly>=5.0.0\",\n    \"python-dotenv>=1.0.0\",\n]\n\n[project.optional-dependencies]\ndev = [\n    \"pytest>=7.0\",\n    \"black>=23.0\",\n    \"pylint>=2.15\",\n    \"flake8>=5.0\",\n]\ngunicorn = [\n    \"gunicorn>=21.0\",\n]\n\n[project.urls]\nHomepage = \"https://github.com/yourusername/whatsapp-analyzer\"\nDocumentation = \"https://github.com/yourusername/whatsapp-analyzer#readme\"\nRepository = \"https://github.com/yourusername/whatsapp-analyzer.git\"\nIssues = \"https://github.com/yourusername/whatsapp-analyzer/issues\"\n\n[tool.setuptools]\npackage-dir = {\"\" = \".\"}\n\n[tool.setuptools.packages.find]\nwhere = [\"src\", \".\"]\ninclude = [\"src*\", \"app*\", \"main*\"]\n\n[tool.black]\nline-length = 100\ntarget-version = [\"py39\", \"py310\", \"py311\"]\n\n[tool.pylint.messages_control]\ndisable = [\n    \"C0111\",  # missing-docstring\n    \"R0913\",  # too-many-arguments\n    \"W0212\",  # protected-access\n]\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\npython_files = [\"test_*.py\", \"*_test.py\"]\n\n[tool.isort]\nprofile = \"black\"\nline_length = 100\n"
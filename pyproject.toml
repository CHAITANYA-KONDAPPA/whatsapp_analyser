[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-nlp-analyzer"
version = "1.0.0"
description = "NLP-based sentiment analysis and communication patterns from WhatsApp exports"
readme = "Readme.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Chaitanya Kondappa", email = "dev@example.com"},
]
keywords = ["whatsapp", "nlp", "sentiment-analysis", "machine-learning", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "nltk>=3.8",
    "textblob>=0.17.0",
    "vaderSentiment>=3.3.0",
    "wordcloud>=1.9.3",
    "matplotlib>=3.9.1",
    "seaborn>=0.13.2",
    "Pillow>=10.4.0",
    "plotly>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "pylint>=2.15",
    "flake8>=5.0",
]
gunicorn = [
    "gunicorn>=21.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/whatsapp-analyzer"
Documentation = "https://github.com/yourusername/whatsapp-analyzer#readme"
Repository = "https://github.com/yourusername/whatsapp-analyzer.git"
Issues = "https://github.com/yourusername/whatsapp-analyzer/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["src*", "app*", "main*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.isort]
profile = "black"
line_length = 100
